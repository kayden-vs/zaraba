version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: zaraba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaraba
      POSTGRES_PASSWORD: zaraba_secret
      POSTGRES_DB: exchange
    volumes:
      # Named volume keeps data between restarts
      - zaraba_pgdata:/var/lib/postgresql/data
      # init.sql is run automatically the first time the container starts
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Expose so you can connect from the host with psql / pgAdmin
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaraba -d exchange"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zaraba-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # wait for Postgres to be ready
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://zaraba:zaraba_secret@db:5432/exchange?sslmode=disable
      # Optional — set your CoinGecko API key here or in a .env file
      API_KEY: ${API_KEY:-}
      CSRF_SECURE_COOKIE: "false"   # set to "true" when behind HTTPS
      DISABLE_CSRF: "false"
    ports:
      - "8080:8080"   # HTTP
      - "50051:50051" # gRPC
    command:
      - "-addr=:8080"
      - "-grpc-addr=:50051"
      - "-dsn=postgres://zaraba:zaraba_secret@db:5432/exchange?sslmode=disable"

volumes:
  zaraba_pgdata:
