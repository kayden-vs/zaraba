syntax = "proto3";

package pb;

option go_package = "github.com/kayden-vs/zaraba/pb";

service Exchange {
    rpc PlaceMarketOrder(Order) returns (Match);
    rpc PlaceLimitOrder(PlaceLimitOrderRequest) returns (Match);
}

message Order {
    int64 id = 1;
    int64 price = 2; 
    int64 size = 3; // Base asset quantity in integer units
    bool bid = 4;
    Limit limit = 5;
    int64 timestamp = 6;
}

message Limit {
    int64 price = 1; // Price in micro-USDT (1 USDT = 1,000,000 units)
    repeated Order orders = 2;
    int64 total_volume = 3; // Total volume in base asset integer units
}

message PlaceLimitOrderRequest {
    int64 price = 1; // Price in micro-USDT (1 USDT = 1,000,000 units)
    Order order = 2;
}

message Match {
    Order ask = 1;
    Order bid = 2;
    int64 sizeFilled = 3; // Filled quantity in base asset integer units
    int64 price = 4; // Price in micro-USDT (1 USDT = 1,000,000 units)
}